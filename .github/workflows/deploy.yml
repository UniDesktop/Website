name: Deploy Docs Website to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 如果开启了 Starlight 的最后更新时间（lastUpdated）功能，需要拉取完整 Git 历史
          fetch-depth: 0

      - name: Install, build, and upload Astro site
        uses: withastro/action@v3
        with:
          package-manager: npm
          node-version: 22

      # GitHub Pages used to run everything through Jekyll. A Jekyll build
      # ignores files and directories whose name starts with `_`, which is
      # exactly how Astro names its asset directory (`_astro/`) — the site then
      # renders with no CSS and no scripts. An empty `.nojekyll` file at the
      # root of the artifact tells Pages to serve the files as-is.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publishing the artifact explicitly (rather than letting
      # `withastro/action` do it) makes `path` visible here, so the artifact
      # always contains the Astro output root and nothing else.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
